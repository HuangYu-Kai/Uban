# ★ 2026-08-04：修 Gradle daemon JVM 崩潰（hs_err arena.cpp:168 Out of Memory，
#   Native malloc 失敗於 C2 CompilerThread）。根因不是單一 daemon 太大，而是
#   **Kotlin Compile Daemon 是另一個獨立 JVM，會直接繼承 org.gradle.jvmargs**。
#   原設定等於 Gradle 3G + Kotlin 3G、metaspace 各 1G、code cache 各 512m，
#   在本機（15.7G RAM、commit 已達 35/40G）同時索取約 9G，必定撞牆。
#   對策：Gradle daemon 保留 -Xmx3G（原本能成功建置，不動堆大小以免改出
#   Java heap OOM），但把過大的 metaspace / code cache 收斂；Kotlin daemon
#   則用 kotlin.daemon.jvmargs 單獨指定——這個專案的 Kotlin 程式碼只有
#   MainActivity 與外掛註冊樣板，1G 綽綽有餘。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
kotlin.incremental=false
